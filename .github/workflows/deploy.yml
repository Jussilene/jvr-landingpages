name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # O repositório ainda possui o deploy legado "Deploy from a branch".
      # Ele publica a raiz da main e pode sobrescrever o artefato compilado.
      # A espera garante que este workflow, que publica dist/, finalize por último.
      - name: Wait for legacy branch deployment
        run: sleep 75
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
